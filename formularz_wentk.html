<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formularz</title>
    <style>
        main {
            max-width: 1100px;
            margin: 25px auto;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: normal;
            margin-bottom: 55px;
        }

        table {
            width: 100%;
            table-layout: fixed;
            border-spacing: 0;
        }

        td {
            padding: 0 12px;
            vertical-align: top;
        }

        .gora {
            height: 185px;
        }

        .dojazd {
            padding-top: 45px;
            padding-left: 65px;
        }

        .przyciski {
            padding-top: 85px;
        }

        .przyciski input,
        .przyciski button {
            display: block;
            width: 110px;
            margin-bottom: 8px;
        }

        .przyciski button:last-child {
            margin-top: 20px;
        }

        input[type="color"] {
            width: 85px;
            vertical-align: middle;
        }

        input[type="range"] {
            width: 100px;
        }

        .ciasto label {
            display: block;
            margin-bottom: 8px;
        }

        textarea {
            resize: vertical;
        }

        @media (max-width: 720px) {
            table, tbody, tr, td {
                display: block;
            }

            .gora {
                height: auto;
            }

            td, .dojazd, .przyciski {
                padding: 0 12px;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 id="tytul" tabindex="-1">Formularz</h1>

        <form id="formularz" action="mailto:natanxvb10@gmail.com" method="post" enctype="text/plain">
            <table role="presentation">
                <colgroup>
                    <col style="width: 38%">
                    <col style="width: 37%">
                    <col style="width: 25%">
                </colgroup>
                <tbody>
                    <tr class="gora">
                        <td>
                            <label>Imię <input type="text" name="Imię" size="14"></label><br><br>
                            <label>Nazwisko <input type="text" name="Nazwisko" size="14" required></label>
                        </td>
                        <td>
                            <label>Data urodzenia <input type="date" name="Data urodzenia"></label><br><br>
                            <label>Obecna godzina <input type="time" name="Obecna godzina"></label><br>
                            <label>Twój ulubiony kolor <input type="color" name="Ulubiony kolor"></label>
                        </td>
                        <td>
                            Czy masz 18 lat?<br><br>
                            <label><input type="radio" name="Czy masz 18 lat?" value="Tak"> Tak</label><br>
                            <label><input type="radio" name="Czy masz 18 lat?" value="Nie"> Nie</label><br>
                            <label><input type="radio" name="Czy masz 18 lat?" value="Nie wiem"> Nie wiem</label>
                        </td>
                    </tr>
                    <tr>
                        <td class="dojazd">
                            <label for="dojazd">Środek dojazdu<br>do szkoły</label><br>
                            <select id="dojazd" name="Środek dojazdu do szkoły">
                                <option>Auto</option>
                                <option>Autobus</option>
                                <option>Tramwaj</option>
                                <option>Rower</option>
                                <option>Pieszo</option>
                            </select><br><br>
                            <label for="glosnosc">Głośność</label><br>
                            <input id="glosnosc" name="Głośność" type="range" min="0" max="100" value="0">
                        </td>
                        <td class="ciasto">
                            Jakie jest Twoje ulubione<br>ciasto?<br><br>
                            <label><input type="checkbox" name="Ulubione ciasto" value="Jabłecznik"> Jabłecznik</label>
                            <label><input type="checkbox" name="Ulubione ciasto" value="Sernik"> Sernik</label>
                            <label><input type="checkbox" name="Ulubione ciasto" value="Beza"> Beza</label>
                            <label><input type="checkbox" name="Ulubione ciasto" value="Inne"> Inne, jakie?</label>
                            <textarea name="Inne ciasto" aria-label="Jakie inne ciasto?" rows="1" cols="15" maxlength="100"></textarea>
                        </td>
                        <td class="przyciski">
                            <input type="submit" value="Wyślij">
                            <input type="reset" value="Reset">
                            <button type="button" onclick="window.open('https://github.com/natanxvb/test/tree/main/', '_blank', 'noopener')">GitHub</button>
                            <button type="button" onclick="window.location.href = 'index.html'">Wróć</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
    </main>
    <script>
        const formularz = document.getElementById('formularz');

        formularz.addEventListener('submit', (event) => {
            event.preventDefault();
            const dane = new FormData(formularz);
            const temat = encodeURIComponent(dane.get('Nazwisko').trim());
            const tresc = Array.from(dane, ([pole, wartosc]) => pole + ': ' + wartosc);
            window.location.href = formularz.action + '?subject=' + temat
                + '&body=' + encodeURIComponent(tresc.join('\r\n'));
        });

        document.getElementById('wroc').addEventListener('click', () => {
            if (history.length > 1) {
                history.back();
            } else {
                document.getElementById('tytul').focus();
            }
        });
    </script>
</body>
</html>
